apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: barman-cloud
  namespace: flux-system
spec:
  interval: 30m
  targetNamespace: cnpg-system
  install:
    createNamespace: false
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  chart:
    spec:
      chart: plugin-barman-cloud
      version: "0.5.*"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system