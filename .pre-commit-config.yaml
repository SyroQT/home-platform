repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: |
          (?x)^(
            .*\.sops\.yaml|
            .*\.sops\.json|
            \.secrets\.baseline
          )$

  - repo: local
    hooks:
      - id: sops-encrypted-check
        name: Verify SOPS files are encrypted
        language: script
        entry: scripts/check-sops-encrypted.sh
        files: ^secrets/.*\.sops\.yaml$
        pass_filenames: true