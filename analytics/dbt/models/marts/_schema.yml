version: 2

models:

  - name: mart_host_status_latest
    description: >
      Single-row table holding the most recent host snapshot. Selects the
      latest row from int_host_snapshots_enriched — all business logic lives
      there. Smoke-test for the full pipeline (source → staging → intermediate → mart).
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "count(*) = 1"
          name: mart_host_status_latest_is_single_row
    columns:
      - name: snapshot_id
        data_tests:
          - not_null
      - name: collected_at
        data_tests:
          - not_null

  - name: mart_host_status_history
    description: >
      Time-series, one row per snapshot, last 14 days. 
      Used for trend charts.
    data_tests:
      - dbt_utils.expression_is_true:
          arguments:
            expression: "count(*) = 14"
          name: mart_host_status_history_has_two_weeks
    columns:
      - name: snapshot_id
        data_tests:
          - not_null
          - unique
      - name: collected_at
        data_tests:
          - not_null
      
