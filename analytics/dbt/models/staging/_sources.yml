version: 2

sources:

  - name: source_host
    description: "VPS host snapshots — CPU, memory, disk, uptime, service status"
    tables:
      - name: snapshots
        description: "One JSON file per 15-minute collection run"
        config:
          external_location: >-
            read_json_auto([{%- set _base = env_var('ANALYTICS_RAW_BASE_PATH') -%}{%- set _days = var('analytics_history_days', 16) -%}{%- set _paths = [] -%}{%- for _i in range(_days) -%}{%- set _d = modules.datetime.date.today() - modules.datetime.timedelta(days=_i) -%}{%- do _paths.append("'" ~ _base ~ '/host/' ~ _d.strftime('%Y') ~ '/' ~ _d.strftime('%m') ~ '/' ~ _d.strftime('%d') ~ "/*.json'") -%}{%- endfor -%}{{ _paths | join(', ') }}], filename=true)

  - name: source_k8s_cluster
