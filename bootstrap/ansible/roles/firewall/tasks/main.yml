---
- name: Reset UFW rules
  community.general.ufw:
    state: reset

- name: Allow SSH from trusted CIDRs in UFW (public fallback)
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "{{ item }}"
    to_port: "22"
  loop: "{{ ssh_allowed_cidrs }}"
  when: not (tailscale_ssh_only | default(false))

- name: Allow all traffic on tailscale0 interface
  community.general.ufw:
    rule: allow
    interface: tailscale0
    direction: in

- name: Allow SSH from Tailscale CGNAT range
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    from_ip: "100.64.0.0/10"
    to_port: "22"

- name: Allow configured TCP ports in UFW
  community.general.ufw:
    rule: allow
    direction: in
    proto: tcp
    to_port: "{{ item }}"
  loop: "{{ ufw_allowed_tcp_ports }}"

- name: Set default incoming policy to deny
  community.general.ufw:
    direction: incoming
    policy: deny

- name: Set default outgoing policy to allow
  community.general.ufw:
    direction: outgoing
    policy: allow

- name: Enable UFW
  community.general.ufw:
    state: enabled
