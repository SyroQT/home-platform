---
- name: Check uv
  ansible.builtin.command: uv --version
  failed_when: false
  changed_when: false
  register: uv_check

- name: Install uv
  ansible.builtin.shell: curl -LsSf https://astral.sh/uv/install.sh | sh
  environment:
    UV_INSTALL_DIR: /usr/local/bin
  when: uv_check.rc != 0

- name: Create analytics data dir
  ansible.builtin.file:
    path: /srv/data/analytics
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create dbt install dir
  ansible.builtin.file:
    path: "{{ analytics_dbt_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Sync dbt project files
  ansible.posix.synchronize:
    src: "{{ playbook_dir }}/../../../analytics/dbt/"
    dest: "{{ analytics_dbt_install_dir }}/"
    rsync_opts:
      - "--exclude=profiles.yml"
      - "--exclude=.user.yml"
      - "--exclude=target/"
      - "--exclude=dbt_packages/"
    delete: true

- name: Deploy pyproject.toml
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../analytics/pyproject.toml"
    dest: "{{ analytics_dbt_install_dir }}/pyproject.toml"
    owner: root
    group: root
    mode: "0644"

# The lockfile pins the full dependency tree (dbt-core included — pyproject.toml alone
# pins only dbt-duckdb). Without it, uv resolves dbt-core fresh on every deploy: a
# deploy around 2026-07-30 silently upgraded dbt-core to 1.12.0 and broke ingestion.
- name: Deploy uv.lock
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../../../analytics/uv.lock"
    dest: "{{ analytics_dbt_install_dir }}/uv.lock"
    owner: root
    group: root
    mode: "0644"

- name: Sync Python environment from lockfile
  ansible.builtin.command: uv sync --frozen
  args:
    chdir: "{{ analytics_dbt_install_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ analytics_dbt_venv_dir }}"
  changed_when: false

- name: Set run_dbt.sh permissions
  ansible.builtin.file:
    path: "{{ analytics_dbt_install_dir }}/run_dbt.sh"
    owner: root
    group: root
    mode: "0755"

- name: Template profiles.yml
  ansible.builtin.template:
    src: profiles.yml.j2
    dest: "{{ analytics_dbt_install_dir }}/profiles.yml"
    owner: root
    group: root
    mode: "0600"

- name: Run dbt deps
  ansible.builtin.command: >
    uv run --frozen dbt deps --profiles-dir {{ analytics_dbt_install_dir }}
  args:
    chdir: "{{ analytics_dbt_install_dir }}"
  environment:
    UV_PROJECT_ENVIRONMENT: "{{ analytics_dbt_venv_dir }}"
  changed_when: false

- name: Install systemd service runner
  ansible.builtin.template:
    src: dbt-runner.service.j2
    dest: /etc/systemd/system/analytics-dbt-runner.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install systemd timer
  ansible.builtin.template:
    src: dbt-runner.timer.j2
    dest: /etc/systemd/system/analytics-dbt-runner.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start timer
  ansible.builtin.systemd:
    name: analytics-dbt-runner.timer
    enabled: true
    state: started

- name: Install systemd service metadata
  ansible.builtin.template:
    src: dbt-runner-meta.service.j2
    dest: /etc/systemd/system/analytics-dbt-runner-meta.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Install systemd timer metadata
  ansible.builtin.template:
    src: dbt-runner-meta.timer.j2
    dest: /etc/systemd/system/analytics-dbt-runner-meta.timer
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Enable and start timer metadata
  ansible.builtin.systemd:
    name: analytics-dbt-runner-meta.timer
    enabled: true
    state: started
