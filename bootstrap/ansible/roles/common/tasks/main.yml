---
- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name:
      - sudo
      - curl
      - vim
      - git
      - htop
      - ca-certificates
      - gnupg
      - ufw
      - qemu-guest-agent
      - acl
    state: present

- name: Set timezone
  community.general.timezone:
    name: "{{ timezone }}"

- name: Ensure admin group exists
  ansible.builtin.group:
    name: "{{ admin_group }}"
    state: present

- name: Ensure admin user exists
  ansible.builtin.user:
    name: "{{ admin_user }}"
    group: "{{ admin_group }}"
    groups: sudo
    append: true
    shell: /bin/bash
    create_home: true

- name: Ensure .ssh directory exists for admin user
  ansible.builtin.file:
    path: "/home/{{ admin_user }}/.ssh"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_group }}"
    mode: "0700"

- name: Install authorized keys for admin user
  ansible.posix.authorized_key:
    user: "{{ admin_user }}"
    key: "{{ item }}"
    state: present
  loop: "{{ ssh_public_keys }}"

- name: Allow admin user passwordless sudo
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ admin_user }}"
    content: "{{ admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
    owner: root
    group: root
    mode: "0440"
    validate: "/usr/sbin/visudo -cf %s"
