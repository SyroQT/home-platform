---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: apps-actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - budget.titas.dev
      secretName: actual-tls
    - hosts:
        - budget.tirami.lt
      secretName: actual-tirami-tls
  rules:
    - host: budget.titas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 80
    - host: budget.tirami.lt
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 80

