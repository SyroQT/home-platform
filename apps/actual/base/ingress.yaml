apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: actual
  namespace: apps-actual
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - beta-budget.titas.dev
      secretName: actual-tls
  rules:
    - host: beta-budget.titas.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: actual
                port:
                  number: 80