apiVersion: apps/v1
kind: Deployment
metadata:
  name: actual
  namespace: apps-actual
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: actual
  template:
    metadata:
      labels:
        app: actual
        home-platform/analytics-collect: "true"
    spec:
      containers:
        - name: actual
          image: actualbudget/actual-server:26.4.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5006
              name: http
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          env:
            - name: ACTUAL_PORT
              value: "5006"
            - name: TZ
              value: "Europe/Amsterdam"
            - name: ACTUAL_OPENID_DISCOVERY_URL
              value: "https://accounts.google.com/.well-known/openid-configuration"
            - name: ACTUAL_OPENID_SERVER_HOSTNAME
              value: "https://budget.titas.dev"
            - name: ACTUAL_OPENID_AUTH_METHOD
              value: "openid"
            - name: ACTUAL_OPENID_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: actual-openid
                  key: ACTUAL_OPENID_CLIENT_ID
            - name: ACTUAL_OPENID_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: actual-openid
                  key: ACTUAL_OPENID_CLIENT_SECRET
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: actual-data
