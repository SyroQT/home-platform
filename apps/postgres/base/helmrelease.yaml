apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: postgres
  namespace: infra-postgres
spec:
  interval: 30m
  chart:
    spec:
      chart: cluster
      version: "0.6.*"
      sourceRef:
        kind: HelmRepository
        name: cnpg
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    remediation:
      retries: 3
  values:
    type: postgresql
    version:
      postgresql: "16"

    cluster:
      instances: 1
      enableSuperuserAccess: false
      initdb:
        database: n8n
        owner: app_platform
        secret:
          name: postgres-auth
      managed:
        roles:
          - name: n8n
            ensure: present
            login: true
            passwordSecret:
              name: postgres-n8n-auth
      storage:
        storageClass: local-path
        size: 8Gi
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          cpu: 500m
          memory: 768Mi
      monitoring:
        enabled: false

      backups:
        enabled: true

        endpointURL: https://nbg1.your-objectstorage.com

        destinationPath: s3://k3s-prod-backups/cnpg/

        s3:
          region: nbg1

        secret:
          create: false
          name: postgres-backup-s3

        scheduledBackups:
          - name: daily-backup
            schedule: "0 0 3 * * *"
            backupOwnerReference: self

        retentionPolicy: "7d"